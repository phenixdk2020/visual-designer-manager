name: Apply RC.2 parity migration

on:
  push:
    branches: [rc2-v1-functional-visual-parity]
    paths:
      - tools/apply_rc2_parity.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc2-v1-functional-visual-parity

      - name: Apply deterministic RC.2 patches
        run: python3 tools/apply_rc2_parity.py

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done

      - name: JavaScript syntax
        run: node --check assets/designer.js

      - name: Identity gate
        run: python3 tests/identity_gate.py

      - name: Commit applied parity changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No parity changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src assets
          git commit -m 'Apply RC.2 visual and migration parity [skip rc2 apply]'
          git push
