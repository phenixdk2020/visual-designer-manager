name: Apply RC.3 update UI

on:
  push:
    branches: [rc3-github-updater]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip rc3 ui]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc3-github-updater

      - name: Apply update UI patch
        run: python3 tools/apply_rc3_update_ui.py

      - name: Validate PHP
        shell: bash
        run: |
          set -euo pipefail
          php -l src/Admin/ParityController.php >/dev/null
          php -l src/Update/GitHubUpdater.php >/dev/null
          php -l src/Core/Plugin.php >/dev/null
          php -l visual-designer-manager.php >/dev/null

      - name: Identity gate
        run: python3 tests/identity_gate.py

      - name: Commit update UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Admin/ParityController.php
          if git diff --cached --quiet; then
            echo 'Update UI already applied.'
          else
            git commit -m 'Integrate GitHub updater with VDM update page [skip rc3 ui]'
            git push origin HEAD:rc3-github-updater
          fi
