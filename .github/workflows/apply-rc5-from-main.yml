name: Temporary RC.5 Branch Apply Runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-rc5-from-main.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc5-v1-page-workflow
          fetch-depth: 0

      - name: Apply deterministic RC.5 transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_rc5.py

      - name: Validate transformed RC.5
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done
          node --check assets/designer.js
          node --check assets/page-workflow.js
          python3 tests/rc5_page_workflow_contract.py
          echo 'RC.5 deterministic transformation: PASS'

      - name: Commit transformed runtime to RC.5 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visual-designer-manager.php src/Core/Plugin.php src/Admin/ParityController.php src/Admin/DesignerController.php assets/designer.js src/Frontend/FrontendController.php templates/page-shell.php .github/workflows/qa.yml README.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'No transformed runtime changes to commit.'
            exit 0
          fi
          git commit -m 'Implement RC.5 V1 page workflow parity'
          git push origin HEAD:rc5-v1-page-workflow
