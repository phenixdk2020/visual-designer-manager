name: Fix RC.3 geometry compatibility

on:
  push:
    branches: [rc3-github-updater]
    paths:
      - .github/workflows/fix-rc3-geometry-compat.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc3-github-updater

      - name: Preserve canonical grid and fine geometry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/Transfer/SchemaOneMigrator.php')
          text = path.read_text(encoding='utf-8')
          old = '''        $sourceX = max(0, min($units - 1, (int) ($raw['x'] ?? 0)));
        $sourceW = max(1, min($units - $sourceX, (int) ($raw['w'] ?? $units)));
        $fineX = max(0, min(119, (int) round(($sourceX * 120) / $units)));
        $fineW = max(1, min(120 - $fineX, (int) round(($sourceW * 120) / $units)));
        $x = max(0, min(11, (int) floor($fineX / 10)));
        $right = (int) ceil(($fineX + $fineW) / 10);
        $w = max(1, min(12 - $x, $right - $x));
'''
          new = '''        $factor = $units / 12;
        $x = (int) round(((int) ($raw['x'] ?? 0)) / $factor);
        $w = (int) round(((int) ($raw['w'] ?? $units)) / $factor);
        $x = max(0, min(11, $x));
        $w = max(1, min(12 - $x, $w));

        $sourceX = max(0, min($units - 1, (int) ($raw['x'] ?? 0)));
        $sourceW = max(1, min($units - $sourceX, (int) ($raw['w'] ?? $units)));
        $fineX = max(0, min(119, (int) round(($sourceX * 120) / $units)));
        $fineW = max(1, min(120 - $fineX, (int) round(($sourceW * 120) / $units)));
'''
          if old not in text:
              raise SystemExit('Geometry method marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate regression contracts
        run: |
          php -l src/Transfer/SchemaOneMigrator.php >/dev/null
          python3 tests/identity_gate.py
          python3 tests/rc1_schema_one_migration_contract.py
          python3 tests/rc2_parity_contract.py

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Transfer/SchemaOneMigrator.php
          git commit -m 'Preserve canonical grid alongside fine migration geometry'
          git push origin HEAD:rc3-github-updater
