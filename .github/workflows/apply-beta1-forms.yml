name: Apply VDM 2 beta.1 Forms

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_beta1_forms.py'
      - '.github/workflows/apply-beta1-forms.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip beta1 apply]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic beta.1 Forms migration
        run: python3 .github/scripts/apply_beta1_forms.py

      - name: Validate JavaScript and PHP
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/designer.js
          php -l src/Model/NodeSchema.php >/dev/null
          php -l src/Frontend/Renderer.php >/dev/null
          php -l src/Frontend/FormRenderer.php >/dev/null
          php -l src/Forms/FormSubmissionController.php >/dev/null
          php -l src/Admin/DesignerController.php >/dev/null
          php -l src/Core/Plugin.php >/dev/null

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'phenixdk2020'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add assets/designer.js src/Model/NodeSchema.php src/Frontend/Renderer.php src/Admin/DesignerController.php src/Core/Plugin.php visual-designer-manager.php
          git commit -m 'Apply VDM 2 beta.1 Forms [skip beta1 apply]'
          git push origin HEAD:main
