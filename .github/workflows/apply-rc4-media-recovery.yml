name: Apply RC.4 media recovery

on:
  push:
    branches: [rc4-media-recovery-final]
    paths:
      - .github/workflows/apply-rc4-media-recovery.yml
      - tools/apply_rc4_media_recovery.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc4-media-recovery-final

      - name: Apply RC.4 patch
        run: python3 tools/apply_rc4_media_recovery.py

      - name: Validate affected runtime
        shell: bash
        run: |
          set -euo pipefail
          php -l visual-designer-manager.php >/dev/null
          php -l src/Transfer/LegacyMediaRecovery.php >/dev/null
          php -l src/Transfer/SchemaOneMigrator.php >/dev/null
          php -l src/Admin/TransferController.php >/dev/null
          python3 tests/identity_gate.py
          python3 tests/rc1_schema_one_migration_contract.py
          python3 tests/rc2_parity_contract.py
          python3 tests/rc3_github_updater_contract.py
          python3 tests/rc4_legacy_media_recovery_contract.py

      - name: Commit RC.4 integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visual-designer-manager.php src/Transfer/SchemaOneMigrator.php src/Admin/TransferController.php tests/rc3_github_updater_contract.py README.md CHANGELOG.md
          git commit -m 'Integrate RC.4 legacy media recovery'
          git push origin HEAD:rc4-media-recovery-final
