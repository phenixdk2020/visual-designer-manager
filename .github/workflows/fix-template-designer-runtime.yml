name: Fix VDM 2 Template Designer Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_template_designer_runtime.py'
      - '.github/workflows/fix-template-designer-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip template fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Designer runtime endpoints
        run: python3 .github/scripts/fix_template_designer_runtime.py

      - name: Validate JavaScript
        run: node --check assets/designer.js

      - name: Commit runtime fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'phenixdk2020'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add assets/designer.js
          git commit -m 'Fix V2 Template Designer runtime endpoints [skip template fix]'
          git push origin HEAD:main
