name: Finalize VDM 2 beta.3

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/finalize_beta3.py'
      - '.github/workflows/finalize-beta3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip beta3 finalize]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply beta.3 finalization
        run: python3 .github/scripts/finalize_beta3.py

      - name: Validate beta.3 candidate
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done
          python3 tests/identity_gate.py
          python3 tests/beta1_forms_contract.py
          python3 tests/beta2_navigation_site_settings_contract.py
          python3 tests/beta3_portable_transfer_contract.py

      - name: Commit beta.3 finalization
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No beta.3 changes to commit.'
            exit 0
          fi
          git config user.name 'phenixdk2020'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add visual-designer-manager.php src README.md CHANGELOG.md tests .github/workflows/qa.yml
          git commit -m 'Finalize VDM 2.0.0-beta.3 [skip beta3 finalize]'
          git push origin HEAD:main
