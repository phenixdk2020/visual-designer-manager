name: Apply VDM 2 RC.1 Visual Parity Props

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_rc1_visual_parity_props.py'
      - '.github/workflows/apply-rc1-visual-parity-props.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply RC.1 visual parity properties
        run: python3 .github/scripts/apply_rc1_visual_parity_props.py
      - name: Validate syntax
        run: |
          php -l src/Model/NodeSchema.php
          php -l src/Frontend/Renderer.php
          php -l src/Transfer/SchemaOneMigrator.php
          node --check assets/designer.js
      - name: Commit RC.1 visual parity properties
        run: |
          if git diff --quiet; then
            echo 'No RC.1 visual parity changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Model/NodeSchema.php src/Frontend/Renderer.php src/Transfer/SchemaOneMigrator.php assets/designer.js assets/frontend.css
          git commit -m 'Preserve RC.1 text container button visual properties [skip rc1 visual apply]'
          git push origin HEAD:main
