name: Visual Designer Manager 2 QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done
          echo 'PHP syntax: PASS'

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/designer.js
          node --check assets/frontend.js
          node --check assets/vehicle-admin.js
          node --check assets/gallery-admin.js
          node --check assets/site-settings.js
          node --check assets/page-workflow.js

      - name: V2 identity gate
        run: python3 tests/identity_gate.py

      - name: V2 bootstrap contract
        run: python3 tests/v2_contract.py

      - name: Alpha 2 Designer contract
        run: python3 tests/alpha2_designer_contract.py

      - name: Alpha 3 interaction contract
        run: python3 tests/alpha3_interaction_contract.py

      - name: Alpha 4 editor controls contract
        run: python3 tests/alpha4_editor_controls_contract.py

      - name: Alpha 5 site shell contract
        run: python3 tests/alpha5_site_shell_contract.py

      - name: Template Designer runtime contract
        run: python3 tests/template_designer_runtime_contract.py

      - name: Alpha 6 Events contract
        run: python3 tests/alpha6_events_contract.py

      - name: Alpha 7 Vehicles contract
        run: python3 tests/alpha7_vehicles_contract.py

      - name: Alpha 8 Gallery contract
        run: python3 tests/alpha8_gallery_contract.py

      - name: Beta 1 Forms contract
        run: python3 tests/beta1_forms_contract.py

      - name: Beta 2 Navigation and Site Settings contract
        run: python3 tests/beta2_navigation_site_settings_contract.py

      - name: Beta 3 Portable transfer contract
        run: python3 tests/beta3_portable_transfer_contract.py

      - name: RC.1 schema 1.0 migration contract
        run: python3 tests/rc1_schema_one_migration_contract.py

      - name: RC.1 acceptance preflight contract
        run: python3 tests/rc1_acceptance_preflight_contract.py

      - name: RC.2 functional and visual parity contract
        run: python3 tests/rc2_parity_contract.py

      - name: RC.3 GitHub updater contract
        run: python3 tests/rc3_github_updater_contract.py

      - name: RC.4 legacy media recovery contract
        run: python3 tests/rc4_legacy_media_recovery_contract.py

      - name: RC.5 V1 page workflow contract
        run: python3 tests/rc5_page_workflow_contract.py

      - name: Install package contract
        run: python3 tests/package_contract.py
