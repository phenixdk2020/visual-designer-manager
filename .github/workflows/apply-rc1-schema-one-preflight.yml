name: Apply VDM 2 RC.1 Schema 1.0 Preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_rc1_schema_one_preflight.py'
      - '.github/workflows/apply-rc1-schema-one-preflight.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply RC.1 preflight integration
        run: python3 .github/scripts/apply_rc1_schema_one_preflight.py
      - name: Validate PHP
        run: |
          php -l src/Transfer/SchemaOneMigrator.php
          php -l src/Admin/TransferController.php
          php -l visual-designer-manager.php
      - name: Commit RC.1 integration
        run: |
          if git diff --quiet; then
            echo 'No RC.1 changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Admin/TransferController.php visual-designer-manager.php
          git commit -m 'Apply VDM 2 RC.1 schema 1.0 preflight [skip rc1 apply]'
          git push origin HEAD:main
