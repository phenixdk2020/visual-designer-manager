name: Finalize VDM 2 beta.1 Forms

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/finalize_beta1_forms.py'
      - '.github/workflows/finalize-beta1-forms.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip beta1 finalize]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add canonical form CSS
        run: python3 .github/scripts/finalize_beta1_forms.py

      - name: Validate syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/designer.js
          find src -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done

      - name: Commit finalizer changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'phenixdk2020'
          git config user.email '74060601+phenixdk2020@users.noreply.github.com'
          git add assets/frontend.css
          git commit -m 'Finalize VDM 2 beta.1 form styling [skip beta1 finalize]'
          git push origin HEAD:main
